name: NeedsMe iOS to TestFlight
# Builds the SwiftUI app on a macOS runner and uploads to TestFlight. Never submits for App Review.
on:
  push:
    branches: [qa-fixes-2026-10-26]
    paths: ['ios-native.tar.gz', 'ios-native/**', '.github/workflows/testflight.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  KEY_ID: 6T836KMTN7
  ISSUER_ID: ae2251a2-85e6-42f5-9071-4f4be62f3b6e
  BUNDLE_ID: shop.ilseplacencia.needsme
  TEAM_ID: GZ9Z6BPTFR
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source (if shipped as ios-native.tar.gz)
        run: |
          if [ -f ios-native.tar.gz ]; then tar xzf ios-native.tar.gz; fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write App Store Connect key files
        env:
          P8_B64: ${{ secrets.ASC_ADMIN_P8_B64 }}
        run: |
          test -n "$P8_B64" || { echo "Missing secret ASC_ADMIN_P8_B64"; exit 1; }
          mkdir -p ~/private_keys
          echo "$P8_B64" | base64 --decode > ~/private_keys/AuthKey_${KEY_ID}.p8
          python3 - <<'PY'
          import json,os
          k=open(os.path.expanduser('~/private_keys/AuthKey_'+os.environ['KEY_ID']+'.p8')).read()
          json.dump({"key_id":os.environ['KEY_ID'],"issuer_id":os.environ['ISSUER_ID'],"key":k,"in_house":False},open(os.path.expanduser('~/asc_api_key.json'),'w'))
          PY
      - name: Create keychain
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s ci.keychain
      - name: Create Distribution certificate and App Store profile
        run: |
          fastlane run cert api_key_path:$HOME/asc_api_key.json keychain_path:$HOME/Library/Keychains/ci.keychain-db keychain_password:ci output_path:$HOME/certs
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain || true
          fastlane run sigh api_key_path:$HOME/asc_api_key.json app_identifier:$BUNDLE_ID output_path:$HOME/profiles filename:needsme.mobileprovision
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i $HOME/profiles/needsme.mobileprovision)")
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
      - name: Generate project
        working-directory: ios-native
        run: xcodegen generate
      - name: Archive (manual signing)
        working-directory: ios-native
        run: |
          BUILD=$(date +%Y%m%d%H%M)
          xcodebuild archive -project NeedsMe.xcodeproj -scheme NeedsMe -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/NeedsMe.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD
      - name: Export and upload to TestFlight
        run: |
          cat > $RUNNER_TEMP/export.plist <<P
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          P
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/NeedsMe.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID
      - name: Commit readable source back to the branch
        if: success()
        run: |
          if [ -f ios-native.tar.gz ]; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git rm -q ios-native.tar.gz
            git add ios-native
            git commit -m "ios-native: unpack SwiftUI source [skip ci]" || true
            git push || true
          fi
